name: Sync CLI Manifest to Portal

on:
  push:
    branches: [main]
    paths:
      - SKILL.md
      - server.json
      - Cargo.toml
      - src/cli.rs
      - src/mcp.rs
      - src/docs.rs
      - src/workspace.rs
  release:
    types: [published]
  workflow_dispatch:

jobs:
  export-and-dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate cli-manifest.json
        run: cargo run -- docs --out cli-manifest.json
      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: cli-manifest.json
      - name: Notify editnovel/portal
        env:
          PORTAL_DISPATCH_TOKEN: ${{ secrets.PORTAL_DISPATCH_TOKEN }}
        run: |
          if [ -z "${PORTAL_DISPATCH_TOKEN}" ]; then
            echo "PORTAL_DISPATCH_TOKEN secret not configured; skipping portal dispatch."
            exit 0
          fi
          PAYLOAD=$(jq -c '{event_type: "editnovel-manifest-updated", client_payload: {manifest: .}}' cli-manifest.json)
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PORTAL_DISPATCH_TOKEN}" \
            https://api.github.com/repos/editnovel/portal/dispatches \
            -d "${PAYLOAD}"
