[package]
name = "editnovel"
version = "0.1.0"
edition = "2024"
description = "Local-first CLI and MCP Server for converting PDFs and EPUBs into clean EPUB 3 and omnibus volumes with staged JSON feedback loops."

[[bin]]
name = "editnovel"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
editnovel-engine = { git = "https://github.com/editnovel/engine", tag = "v0.1.1", version = "0.1.0" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
lopdf = "0.45.0"
quick-xml = "0.42.0"
rayon = "1.12.0"
rc-zip = { version = "5.4.1", features = ["deflate"] }
regex = "1.13.2"
rmcp = { version = "3.11.0", features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
