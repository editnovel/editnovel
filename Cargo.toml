[package]
name = "editnovel"
version = "0.1.0"
edition = "2024"
description = "Local-first CLI and MCP Server for converting PDFs and EPUBs into clean EPUB 3 and omnibus volumes with staged JSON feedback loops."

[[bin]]
name = "editnovel"
path = "src/main.rs"

[dependencies]
editnovel-engine = { git = "https://github.com/editnovel/engine", tag = "v0.1.0" }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
